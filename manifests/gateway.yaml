apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-actors-gateway
  namespace: tekton-actors
  labels:
    app: tekton-actors-gateway
    app.kubernetes.io/part-of: tekton-actors
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-actors-gateway
  labels:
    app: tekton-actors-gateway
    app.kubernetes.io/part-of: tekton-actors
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "tasks", "pipelineruns", "taskruns", "customruns", "customruns/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "configmaps", "secrets", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ate.dev"]
    resources: ["workerpools", "sandboxconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["clustertrustbundles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["podcertificaterequests"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-actors-gateway
  labels:
    app: tekton-actors-gateway
    app.kubernetes.io/part-of: tekton-actors
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-actors-gateway
subjects:
  - kind: ServiceAccount
    name: tekton-actors-gateway
    namespace: tekton-actors
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekton-actors-gateway
  namespace: tekton-actors
  labels:
    app: tekton-actors-gateway
    app.kubernetes.io/part-of: tekton-actors
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tekton-actors-gateway
  template:
    metadata:
      labels:
        app: tekton-actors-gateway
        app.kubernetes.io/part-of: tekton-actors
    spec:
      serviceAccountName: tekton-actors-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ko://github.com/gke-demos/tekton-actors/cmd/gateway
          args:
            - --listen-addr=:8080
            - --namespace=tekton-actors
            - --atespace=tekton-actors
            - --git-oci-url=http://git-oci.demo-repo.svc.cluster.local
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: tekton-actors-gateway
  namespace: tekton-actors
  labels:
    app: tekton-actors-gateway
    app.kubernetes.io/part-of: tekton-actors
spec:
  type: ClusterIP
  selector:
    app: tekton-actors-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
