apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone-and-build
  labels:
    app.kubernetes.io/part-of: tekton-actors
spec:
  description: >-
    Clones fulfillment-api from the in-cluster Git Smart-HTTP server, warms GOCACHE
    inside the shared workspace, and builds a static Linux binary. Supports both
    per-Actor EgressPolicy credential injection (zero ambient secrets) and mounted
    Secret workspaces (Pod+PVC baseline).
  params:
    - name: git-url
      type: string
      default: http://git-oci.demo-repo.svc.cluster.local/repo/fulfillment-api.git
      description: Git Smart-HTTP URL of the repository to build.
    - name: inject-bug
      type: string
      default: "false"
      description: When "true", checks out the "buggy" branch with an off-by-one cent discount regression.
  workspaces:
    - name: source
      description: Shared pipeline workspace storing source code, warm GOCACHE, and compiled artifacts.
    - name: creds
      optional: true
      description: Optional mounted Git/OCI Secret workspace (bound in Pod+PVC mode; omitted in Actor mode).
  results:
    - name: commit-sha
      description: Checked-out Git commit SHA.
    - name: binary-sha256
      description: SHA-256 digest of the compiled fulfillment-api binary.
  steps:
    - name: clone-and-compile
      image: golang:1.26-bookworm
      script: |
        #!/bin/sh
        set -eu

        export GOCACHE="${TEKTON_GOCACHE_OVERRIDE:-$(workspaces.source.path)/.gocache}"
        export GOPROXY=off
        export GOSUMDB=off
        export GOTOOLCHAIN=local
        export CGO_ENABLED=0

        if [ "$(workspaces.creds.bound)" = "true" ] && [ -f "$(workspaces.creds.path)/token" ]; then
          AUTH_TOKEN=$(tr -d '\r\n' < "$(workspaces.creds.path)/token")
          CRED_MODE="mounted-secret"
        else
          AUTH_TOKEN="ate-placeholder"
          CRED_MODE="ate-egress"
        fi

        BRANCH="main"
        if [ "$(params.inject-bug)" = "true" ]; then
          BRANCH="buggy"
        fi

        mkdir -p "$(workspaces.source.path)/bin" "$(workspaces.source.path)/.gocache" "$(workspaces.source.path)/.build-meta"
        if [ -d "$(workspaces.source.path)/app/.git" ]; then
          CACHE_POSTURE="WARM_DURABLE_DIR"
          echo "==> Warm Incremental Fetch $(params.git-url) (branch=${BRANCH}, authMode=${CRED_MODE}, cache=${CACHE_POSTURE})"
          cd "$(workspaces.source.path)/app"
          git remote set-url origin "$(params.git-url)" || true
          if GIT_TERMINAL_PROMPT=0 git \
            -c "http.extraHeader=Authorization: Bearer ${AUTH_TOKEN}" \
            -c "http.extraHeader=X-Tekton-Credential-Mode: ${CRED_MODE}" \
            fetch --depth=1 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" && \
            git checkout -B "${BRANCH}" "refs/remotes/origin/${BRANCH}" && \
            git reset --hard "refs/remotes/origin/${BRANCH}" && \
            git clean -fdx; then
            :
          else
            cd "$(workspaces.source.path)"
            rm -rf "$(workspaces.source.path)/app"
            GIT_TERMINAL_PROMPT=0 git \
              -c "http.extraHeader=Authorization: Bearer ${AUTH_TOKEN}" \
              -c "http.extraHeader=X-Tekton-Credential-Mode: ${CRED_MODE}" \
              clone --branch "${BRANCH}" "$(params.git-url)" "$(workspaces.source.path)/app"
          fi
        else
          CACHE_POSTURE="COLD_WORKSPACE"
          rm -rf "$(workspaces.source.path)/app"
          echo "==> Cloning $(params.git-url) (branch=${BRANCH}, authMode=${CRED_MODE}, cache=${CACHE_POSTURE})"
          GIT_TERMINAL_PROMPT=0 git \
            -c "http.extraHeader=Authorization: Bearer ${AUTH_TOKEN}" \
            -c "http.extraHeader=X-Tekton-Credential-Mode: ${CRED_MODE}" \
            clone --branch "${BRANCH}" "$(params.git-url)" "$(workspaces.source.path)/app"
        fi

        cd "$(workspaces.source.path)/app"
        COMMIT_SHA=$(git rev-parse HEAD)

        echo "==> Building fulfillment-api at commit ${COMMIT_SHA} (cachePosture=${CACHE_POSTURE})"
        go build -trimpath -ldflags="-s -w" -o "$(workspaces.source.path)/bin/fulfillment-api" .
        BIN_SHA=$(sha256sum "$(workspaces.source.path)/bin/fulfillment-api" | awk '{print $1}')

        printf '%s' "${COMMIT_SHA}" > "$(workspaces.source.path)/.build-meta/commit-sha"
        printf '%s' "${CACHE_POSTURE}" > "$(workspaces.source.path)/.build-meta/cache-posture"
        printf '%s' "${COMMIT_SHA}" > "$(results.commit-sha.path)"
        printf '%s' "${BIN_SHA}" > "$(results.binary-sha256.path)"
        echo "==> Built fulfillment-api (commit=${COMMIT_SHA}, sha256=${BIN_SHA}, cachePosture=${CACHE_POSTURE})"
